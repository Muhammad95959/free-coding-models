# 📖 Weekly refresh of src/data/benchmarks.json from models.dev.
# 📖 Synthesizes a new entry for every model in the live catalog (curated values
# 📖 are preserved by the merge step in scripts/update-benchmarks.mjs). If the
# 📖 catalog changed, the workflow opens a PR with the diff so a human can review
# 📖 before merge.
#
# 📖 Why a PR and not a direct push to main:
# 📖 - Auto-merge on a weekly schedule would be too aggressive (a transient bad
# 📖   fetch could wipe curated scores). A human eyeballs the diff.
# 📖 - The release process (`/bump`) re-runs the script anyway, so the data
# 📖   gets refreshed at every release too.

name: Update Benchmarks

on:
  schedule:
    - cron: '0 4 * * 1'  # 📖 Mondays 04:00 UTC
  workflow_dispatch:        # 📖 Manual trigger from the Actions tab

permissions:
  contents: write          # 📖 Needed to open the PR
  pull-requests: write     # 📖 Needed to open the PR

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run update-benchmarks (dry-run, capture diff)
        id: dry
        run: |
          node scripts/update-benchmarks.mjs --dry-run > /tmp/new-benchmarks.json
          echo "new entry count: $(jq 'keys | length' /tmp/new-benchmarks.json)"

      - name: Diff against committed benchmarks.json
        id: diff
        run: |
          if diff -q src/data/benchmarks.json /tmp/new-benchmarks.json > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cp /tmp/new-benchmarks.json src/data/benchmarks.json
            echo "regenerated benchmarks.json with $(jq 'keys | length' src/data/benchmarks.json) entries"
          fi

      - name: Open PR with the diff
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/refresh-benchmarks
          git add src/data/benchmarks.json
          git commit -m "chore: refresh benchmarks.json from models.dev"
          git push origin chore/refresh-benchmarks
          gh pr create \
            --title "🔄 Refresh benchmarks.json from models.dev" \
            --body "Auto-generated by the \`.github/workflows/update-benchmarks.yml\` weekly job.

          The extended benchmark catalog (Coding/Math/Agentic/Reasoning indices, MMLU-Pro, GPQA, HLE, reasoning/vision flags) was refreshed from models.dev. Curated values are preserved by the merge step in \`scripts/update-benchmarks.mjs\`.

          Please eyeball the diff and merge if everything looks right." \
            --base main \
            --head chore/refresh-benchmarks
