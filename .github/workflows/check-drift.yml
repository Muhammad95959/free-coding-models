# 📖 Weekly drift check: diff `sources.js` against the live models.dev catalog
# 📖 and open a GitHub issue if any field drifted (ctx, maxTokens, reasoning,
# 📖 vision, thinking). The issue is informational — we don't fail `main`
# 📖 because catalog drift is expected and a human reviews it via the issue.
#
# 📖 How to consume this:
# 📖 - The CI runs `scripts/check-drift.mjs --threshold 0 --no-fail` (always exits 0)
# 📖 - The drift summary is posted as a comment on the issue
# 📖 - The issue auto-closes if drift drops back to 0
# 📖 - Manual check: `pnpm check:drift` locally

name: Check Catalog Drift

on:
  schedule:
    - cron: '0 5 * * 1'  # 📖 Mondays 05:00 UTC (after the benchmarks refresh)
  workflow_dispatch:

permissions:
  contents: read
  issues: write          # 📖 Needed to open/close the drift issue

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run drift check (report only)
        id: drift
        run: |
          set +e
          node scripts/check-drift.mjs --threshold 0 --no-fail > /tmp/drift-report.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/drift-report.txt

      - name: Find existing drift issue
        if: always()
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label catalog-drift --state open --json number --jq '.[0].number // empty')
          echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Open drift issue (when drift detected)
        if: steps.find.outputs.existing == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.drift.outputs.stdout }}
        run: |
          gh issue create \
            --label catalog-drift \
            --title "🔍 Catalog drift detected vs models.dev" \
            --body "$(cat /tmp/drift-report.txt)

          ---

          Auto-generated by the \`.github/workflows/check-drift.yml\` weekly job.
          Run \`pnpm check:drift\` locally to see the full report. Update \`sources.js\` to match models.dev where appropriate."
          echo "issue opened"

      - name: Comment on existing drift issue
        if: steps.find.outputs.existing != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ steps.find.outputs.existing }}" \
            --body "🔄 Weekly drift re-check:

          $(cat /tmp/drift-report.txt)

          ---

          _Re-generated by \`.github/workflows/check-drift.yml\`. This issue auto-closes when drift drops back to 0._"

      - name: Close issue when no drift
        if: steps.find.outputs.existing != '' && steps.drift.outputs.exit == '0' && !contains(steps.drift.outputs.stdout, 'drift detected')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close "${{ steps.find.outputs.existing }}" \
            --comment "✅ Drift resolved! Auto-closing."
